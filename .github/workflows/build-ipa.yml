# Builds an unsigned VoiceBloom.ipa on a GitHub Mac with Xcode.
# Download it from the run's "Artifacts" section and install it with
# Sideloadly (which signs it with your Apple ID). See README › Install
# without a Mac.
name: Build iPhone app

on:
  workflow_dispatch:
  push:
    paths:
      - "VoiceBloom/**"
      - "project.yml"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project VoiceBloom.xcodeproj \
            -scheme VoiceBloom \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|warning: .*VoiceBloom/|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/VoiceBloom.app

      - name: Package VoiceBloom.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VoiceBloom.app Payload/
          zip -qry VoiceBloom.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceBloom-ipa
          path: VoiceBloom.ipa
          retention-days: 14

      - name: Keep the full build log if anything failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
