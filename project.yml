# XcodeGen project description. GitHub Actions turns this into
# VoiceBloom.xcodeproj on a Mac and builds VoiceBloom.ipa
# (see .github/workflows/build-ipa.yml). The settings match the README's
# Xcode setup steps.
name: VoiceBloom
options:
  bundleIdPrefix: com.williamzhao
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Xcode 26 new-project defaults.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
targets:
  VoiceBloom:
    type: application
    platform: iOS
    sources:
      - VoiceBloom
      # Stage 18: the High Quality splitter model, compiled from
      # Models/*.mlpackage by the build workflow (optional: without it the
      # app uses the Basic engine).
      - path: Models/VocalSeparator.mlmodelc
        type: folder
        optional: true
        buildPhase: resources
      - path: Models/VocalSeparatorBest.mlmodelc
        type: folder
        optional: true
        buildPhase: resources
    dependencies:
      - target: VoiceBloomWidget
    entitlements:
      path: Config/VoiceBloom.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.williamzhao.voicebloom
    scheme:
      testTargets:
        - VoiceBloomTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.williamzhao.voicebloom
        MARKETING_VERSION: "0.5"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chirp
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Chirp listens to your voice while you practice to measure pitch and resonance. Audio is analyzed on your iPhone and never leaves it."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Chirp can show a live transcript of what you say while you practice. Speech is recognized on your iPhone and never leaves it."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Chirp can lock with Face ID so your practice stays private."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Stage 13: the neutral icon users can switch to in Settings.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: NeutralIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # Home Screen and Lock Screen widgets (Stage 12). Shares
  # VoiceBloom/Shared with the app and reads the App Group.
  VoiceBloomWidget:
    type: app-extension
    platform: iOS
    sources:
      - VoiceBloomWidget
      - VoiceBloom/Shared
    info:
      path: Config/VoiceBloomWidget-Info.plist
      properties:
        CFBundleDisplayName: Practice
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/VoiceBloomWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.williamzhao.voicebloom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.williamzhao.voicebloom.widget
        MARKETING_VERSION: "0.5"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
  VoiceBloomTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - VoiceBloomTests
    dependencies:
      - target: VoiceBloom
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.williamzhao.voicebloom.tests
